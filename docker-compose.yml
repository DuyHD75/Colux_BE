version: '3.7'

services:
  spring-config-server:
    image: coluxalpha/mmv3-spring-cloud-config-server:0.0.1-SNAPSHOT
    restart: on-failure
    ports:
      - 8888:8888
    networks:
      - microservices-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/IDENTITYSERVICE_DB?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Duyho75#
      EUREKA.CLIENT.SERVICEURL.DEFAULTZONE: http://naming-server:8761/eureka

  identity-service:
    image: coluxalpha/mmv3-identity-service:0.0.1-SNAPSHOT
    ports:
      - 8100:8100
    networks:
      - microservices-network
    environment:
      EUREKA.CLIENT.SERVICEURL.DEFAULTZONE: http://naming-server:8761/eureka
      SPRING_CONFIG_IMPORT: optional:configserver:http://localhost:8888

networks:
  microservices-network:
    driver: bridge

